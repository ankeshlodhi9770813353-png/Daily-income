<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#93C5FD" stop-opacity="0.2" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#1E3A8A" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Squircle Base for Android Material -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bg-grad)" filter="url(#shadow)" />
  
  <!-- Subtle Inner Ring Accent -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#glow-grad)" stroke-width="6" stroke-dasharray="8 8" opacity="0.6" />

  <!-- Clock Outline / Schedule Ring -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#FFFFFF" stroke-width="18" opacity="0.9" />

  <!-- Hour markers -->
  <line x1="256" y1="126" x2="256" y2="142" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
  <line x1="386" y1="256" x2="370" y2="256" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
  <line x1="256" y1="386" x2="256" y2="370" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
  <line x1="126" y1="256" x2="142" y2="256" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />

  <!-- Clock Hands -->
  <line x1="256" y1="256" x2="256" y2="175" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" />
  <line x1="256" y1="256" x2="320" y2="256" stroke="#93C5FD" stroke-width="10" stroke-linecap="round" />
  <circle cx="256" cy="256" r="14" fill="#FFFFFF" />

  <!-- Completed Checkmark Badge in bottom-right -->
  <g transform="translate(300, 300)">
    <circle cx="50" cy="50" r="48" fill="#10B981" stroke="#FFFFFF" stroke-width="8" />
    <path d="M34 50 L46 62 L68 38" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Letter A for Ankesh Monogram in subtle top left -->
  <text x="75" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" opacity="0.9">A</text>
  <text x="105" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#93C5FD" opacity="0.9">· ROUTINE</text>
</svg>
